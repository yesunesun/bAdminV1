# config/nlp-config.yml
# Natural Language Processing Configuration for Search
# Version: 1.0.0
# Last Modified: 09-07-2025 10:00 IST

# NLP Core Settings
nlp:
  enabled: true
  confidence_threshold: 0.6  # Minimum confidence to apply NLP parsing
  fallback_timeout: 100      # ms - Max time for NLP processing before fallback
  debug_mode: false          # Show NLP parsing details in console

# Intent Recognition Patterns
intent_patterns:
  search_intents:
    - "find"
    - "looking for"
    - "search"
    - "show me"
    - "I want"
    - "need"
    - "get me"
    - "help me find"
  
  location_indicators:
    - "in"
    - "at"
    - "near"
    - "around"
    - "close to"
    - "nearby"
  
  price_indicators:
    - "under"
    - "above"
    - "below"
    - "between"
    - "costing"
    - "priced"
    - "budget"
    - "around"
    - "up to"
    - "starting from"

# Property Type Patterns
property_patterns:
  residential:
    primary_keywords:
      - "apartment"
      - "flat"
      - "house"
      - "villa"
      - "home"
      - "residence"
    
    subtypes:
      - "independent house"
      - "penthouse"
      - "studio"
      - "studio apartment"
      - "service apartment"
      - "duplex"
      - "triplex"
    
    bhk_patterns:
      - "1bhk"
      - "2bhk"
      - "3bhk"
      - "4bhk"
      - "4plus"
      - "1 bhk"
      - "2 bhk"
      - "3 bhk"
      - "4 bhk"
      - "4+ bhk"
      - "one bedroom"
      - "two bedroom"
      - "three bedroom"
      - "four bedroom"
  
  commercial:
    primary_keywords:
      - "office"
      - "shop"
      - "showroom"
      - "commercial"
      - "business"
      - "retail"
    
    subtypes:
      - "office space"
      - "godown"
      - "warehouse"
      - "industrial"
      - "industrial shed"
      - "industrial building"
      - "commercial space"
      - "retail space"
  
  land:
    primary_keywords:
      - "land"
      - "plot"
      - "site"
      - "ground"
    
    subtypes:
      - "agricultural"
      - "residential plot"
      - "commercial land"
      - "industrial land"
      - "mixed use"
      - "farm land"
      - "agricultural land"
  
  special:
    pghostel:
      - "pg"
      - "hostel"
      - "paying guest"
      - "accommodation"
      - "stay"
    
    flatmates:
      - "flatmate"
      - "roommate"
      - "sharing"
      - "shared"
      - "room sharing"
    
    coworking:
      - "coworking"
      - "co-working"
      - "shared office"
      - "workspace"
      - "desk space"

