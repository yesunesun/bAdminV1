# Price Pattern Recognition
price_patterns:
  # Units
  units:
    lakhs:
      - "l"
      - "lakh"
      - "lakhs"
      - "lac"
      - "lacs"
      - "L"
      - "Lakh"
      - "Lakhs"
    
    crores:
      - "cr"
      - "crore"
      - "crores"
      - "CR"
      - "Crore"
      - "Crores"
  
  # Range Indicators
  range_indicators:
    under:
      - "under"
      - "below"
      - "less than"
      - "upto"
      - "up to"
      - "maximum"
      - "max"
    
    above:
      - "above"
      - "over"
      - "more than"
      - "starting from"
      - "minimum"
      - "min"
    
    between:
      - "between"
      - "from"
      - "to"
      - "-"
      - "and"
      - "range"
  
  # Standard Price Ranges (matching existing SearchFilters)
  standard_ranges:
    under_10l:
      min: 0
      max: 10
      unit: "lakh"
      display: "under-10l"
    
    10l_25l:
      min: 10
      max: 25
      unit: "lakh"
      display: "10l-25l"
    
    25l_50l:
      min: 25
      max: 50
      unit: "lakh"
      display: "25l-50l"
    
    50l_75l:
      min: 50
      max: 75
      unit: "lakh"
      display: "50l-75l"
    
    75l_1cr:
      min: 75
      max: 100
      unit: "lakh"
      display: "75l-1cr"
    
    1cr_2cr:
      min: 1
      max: 2
      unit: "crore"
      display: "1cr-2cr"
    
    2cr_5cr:
      min: 2
      max: 5
      unit: "crore"
      display: "2cr-5cr"
    
    5cr_10cr:
      min: 5
      max: 10
      unit: "crore"
      display: "5cr-10cr"
    
    above_10cr:
      min: 10
      max: null
      unit: "crore"
      display: "above-10cr"

# Action Type Patterns
action_patterns:
  buy:
    - "buy"
    - "purchase"
    - "sale"
    - "for sale"
    - "buying"
    - "own"
    - "invest"
  
  rent:
    - "rent"
    - "rental"
    - "lease"
    - "for rent"
    - "renting"
    - "hire"
    - "tenant"

# Common Variations and Typos
typo_corrections:
  common_typos:
    "appartment": "apartment"
    "appartments": "apartment"
    "aprtment": "apartment"
    "lond": "land"
    "plat": "plot"
    "comercial": "commercial"
    "commecial": "commercial"
    "residental": "residential"
    "residencial": "residential"
    "secunderabad": "secunderabad"
    "secundrabad": "secunderabad"
    "gachbowli": "gachibowli"
    "gachibowly": "gachibowli"
    "mudfor": "mudfort"
    "madehapur": "madhapur"
    "kondpur": "kondapur"

# Processing Configuration
processing:
  # Pattern matching settings
  case_sensitive: false
  fuzzy_matching: true
  fuzzy_threshold: 0.8
  
  # Performance settings
  max_processing_time: 200  # milliseconds
  enable_caching: true
  cache_size: 1000
  
  # Validation settings
  min_query_length: 3
  max_query_length: 200
  
  # Debug and logging
  log_parsing_attempts: false
  log_confidence_scores: false
  log_entity_extraction: false

# Feature Flags
features:
  enable_typo_correction: true
  enable_fuzzy_location_matching: true
  enable_price_range_inference: true
  enable_context_awareness: false  # Future feature
  enable_learning_from_usage: false  # Future feature
  enable_synonym_expansion: true
  enable_multi_language: false  # Future feature

# End of file